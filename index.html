html{scroll-padding-top:70px;scroll-behavior:smooth;color-scheme:dark light}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:16px/1.8 "Vazirmatn",system-ui,sans-serif;background:radial-gradient(800px 420px at 50% -80px,color-mix(in srgb,var(--acc) 17%,transparent),transparent),var(--bg);transition:background .3s,color .3s}
.mono,code,pre{font-family:"JetBrains Mono",ui-monospace,monospace}
header{position:sticky;top:0;z-index:5;display:flex;gap:6px;align-items:center;padding:10px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brandh{display:flex;align-items:center;gap:9px;font:700 1.05rem var(--d);letter-spacing:.2em;margin-inline-end:auto}
.lg{background:var(--logo) center/cover no-repeat;border-radius:50%;display:block}
header .lg{width:30px;height:30px;box-shadow:0 0 12px -2px var(--acc)}
.nav a{color:var(--mute);text-decoration:none;padding:0 7px;font-size:.88rem}.nav a:hover{color:var(--acc)}
button,input{font:inherit;color:inherit}
.btn{background:none;border:1px solid var(--line);border-radius:4px;padding:4px 12px;cursor:pointer;transition:box-shadow .2s,border-color .2s}
.btn:hover,.btn.on{border-color:var(--acc);color:var(--acc);box-shadow:0 0 14px -5px var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{max-width:920px;margin:0 auto;padding:0 16px 60px}
.hero{position:relative;text-align:center;padding:30px 0 26px;isolation:isolate;margin:0 -16px}
#cv{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.logo{position:relative;width:min(56vw,230px);aspect-ratio:1;margin:6px auto 18px;perspective:600px}
.logo .lg{position:absolute;inset:13%;box-shadow:var(--glow);animation:pl 4s ease-in-out infinite}
.orb{position:absolute;inset:-4%;border:1px solid color-mix(in srgb,var(--acc) 60%,transparent);border-radius:50%}
.orb::after{content:"";position:absolute;top:-4px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--acc);box-shadow:0 0 12px var(--acc)}
.o1{animation:o1 8s linear infinite}.o2{animation:o2 13s linear infinite reverse}
h1{font:700 clamp(2.6rem,13vw,5.2rem)/1 var(--d);letter-spacing:.16em;margin:0;padding-inline-start:.16em;background:linear-gradient(100deg,var(--ink) 35%,var(--acc) 50%,var(--ink) 65%) 0/250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 7s linear infinite}
.slo{display:flex;justify-content:center;flex-wrap:wrap;gap:.3rem 1.1rem;margin:14px 0 8px;font:700 clamp(.85rem,3.5vw,1.2rem) var(--d);letter-spacing:.2em;direction:ltr}
.slo span{animation:sl .9s both;animation-delay:calc(.4s + var(--n)*.55s)}.slo span:last-child{color:var(--acc)}
p.lead{color:var(--mute);max-width:62ch}.hero p.lead{margin:0 auto;padding:0 16px}
h2{font:700 1.7rem var(--d);margin:0 0 6px}
h2::before{content:"";display:inline-block;width:.5em;height:.5em;margin-inline-end:.5em;background:var(--acc);box-shadow:0 0 10px var(--acc);transform:rotate(45deg)}
h3.fam{font:700 1.2rem var(--d);margin:30px 0 2px;color:var(--acc)}
section{padding:50px 0 8px}
.term{background:#050807;color:#d7e2dc;border:1px solid var(--acc);border-radius:6px;margin-top:8px;overflow:hidden;box-shadow:var(--glow)}
.term .bar{padding:6px 12px;font-size:.8rem;color:#8a9a91;border-bottom:1px solid #16201b}
.term pre{margin:0;padding:12px;height:230px;overflow:auto;font-size:.85rem;line-height:1.5;white-space:pre-wrap}
.term form{display:flex;gap:8px;padding:8px 12px;border-top:1px solid #16201b}
.term input{flex:1;background:none;border:0;outline:0;font-family:"JetBrains Mono",monospace;font-size:.9rem;direction:ltr;color:#d7e2dc;caret-color:#7ee832}
.term .ps{color:#7ee832;font-family:"JetBrains Mono",monospace;font-size:.9rem;direction:ltr}
.note{font-size:.8rem;color:var(--mute);margin-top:6px}
ol.path{list-style:none;margin:20px 0;padding:0;border-inline-start:2px solid var(--line)}
ol.path li{padding:0 20px 22px 20px;position:relative}
ol.path li::before{content:"";position:absolute;inset-inline-start:-7px;top:9px;width:12px;height:12px;border-radius:50%;background:var(--acc);animation:pu 2.4s infinite;animation-delay:calc(var(--k)*.4s)}
ol.path h3{margin:0;font:700 1.1rem var(--d)}ol.path p{margin:2px 0;color:var(--mute);font-size:.92rem}
.dash{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:14px 0}
.meter{flex:1;min-width:160px;height:8px;border-radius:4px;background:var(--bg2);border:1px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--acc);box-shadow:0 0 10px var(--acc);transition:width .5s}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.tools input{flex:1;min-width:180px;background:var(--bg2);border:1px solid var(--line);border-radius:4px;padding:8px 12px}
ul.lessons{list-style:none;margin:0;padding:0}
ul.lessons li{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0;transition:padding .2s;animation:li .4s both;animation-delay:calc(var(--n,0)*35ms)}
ul.lessons li:hover{padding-inline-start:8px;border-bottom-color:var(--acc)}
ul.lessons a{flex:1;cursor:pointer;color:var(--ink);text-decoration:none;word-break:break-all}ul.lessons a:hover{color:var(--acc)}
.lv{font-size:.75rem;color:var(--mute);border:1px solid var(--line);border-radius:10px;padding:0 8px}
.star{background:none;border:0;cursor:pointer;font-size:1.1rem;color:var(--mute)}.star.on{color:#e0a458}
article{background:var(--bg2);border:1px solid var(--line);border-inline-start:3px solid var(--acc);border-radius:6px;padding:18px;margin-top:18px;animation:op .45s ease-out}
article h3{margin-top:0;font-family:var(--d)}
pre.code{background:#050807;color:#d7e2dc;padding:12px;overflow-x:auto;direction:ltr;text-align:left;font-size:.85rem;margin:8px 0;border:1px solid #16201b;border-radius:4px}
.risk{border-inline-start:3px solid #e0a458;padding:2px 12px;margin:12px 0}
.opt{display:block;width:100%;text-align:start;margin:6px 0;background:none;border:1px solid var(--line);border-radius:4px;padding:8px 12px;cursor:pointer}.opt:hover{border-color:var(--acc)}
.opt.ok{border-color:var(--acc);color:var(--acc)}.opt.no{border-color:#e0a458;color:#e0a458}
details{border:1px solid var(--line);border-radius:6px;margin:8px 0;background:var(--bg2);transition:box-shadow .3s}
summary{cursor:pointer;padding:10px 14px;display:flex;gap:10px;align-items:center;list-style:none;font-weight:600}
summary::-webkit-details-marker{display:none}summary::after{content:"+";margin-inline-start:auto;color:var(--acc);font-size:1.2rem}
details[open]{border-color:var(--acc);box-shadow:var(--glow)}details[open] summary::after{content:"\2212"}
details>:not(summary){margin:0 14px 12px;animation:op .4s ease-out}
dl.meta{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-size:.85rem;color:var(--mute)}dl.meta dd{margin:0;color:var(--ink)}dl.meta dt{margin:0}
footer{max-width:920px;margin:0 auto;padding:20px 16px;color:var(--mute);font-size:.85rem;text-align:center}
#sp{position:fixed;top:0;inset-inline-start:0;height:2px;width:0;background:var(--acc);z-index:10;box-shadow:0 0 8px var(--acc)}
@keyframes pl{50%{box-shadow:0 0 50px -4px var(--acc)}}
@keyframes o1{from{transform:rotateX(72deg) rotateZ(0)}to{transform:rotateX(72deg) rotateZ(360deg)}}
@keyframes o2{from{transform:rotateX(72deg) rotateY(55deg) rotateZ(0)}to{transform:rotateX(72deg) rotateY(55deg) rotateZ(360deg)}}
@keyframes sh{to{background-position:-250% 0}}@keyframes sl{from{opacity:0;letter-spacing:.8em;filter:blur(8px)}}
@keyframes pu{0%,100%{box-shadow:0 0 0 0 var(--acc)}60%{box-shadow:0 0 0 7px transparent}}
@keyframes op{from{clip-path:inset(0 0 100% 0);opacity:.3}to{clip-path:inset(0);opacity:1}}@keyframes li{from{opacity:0;transform:translateY(6px)}}
.stack{display:grid;gap:18px;margin:18px 0}
.ly{position:relative;text-align:start;border:1px solid var(--line);background:var(--bg2);border-radius:6px;padding:12px 16px;cursor:pointer;transition:all .4s;color:var(--ink)}
.ly b{font:700 1.05rem var(--d)}.ly span{display:block;color:var(--mute);font-size:.88rem}
.ly:not(:last-child)::after{content:"\25BC";position:absolute;inset-inline-start:50%;bottom:-19px;color:var(--acc);font-size:.8rem;animation:bl 1.2s steps(2) infinite}
.stack.back .ly:not(:last-child)::after{content:"\25B2"}
.ly.on{border-color:var(--acc);box-shadow:var(--glow);transform:scale(1.02);background:color-mix(in srgb,var(--acc) 10%,var(--bg2))}
.cap{min-height:3.6em;border-inline-start:3px solid var(--acc);padding:4px 12px;margin:10px 0}
.anat{display:flex;gap:10px;flex-wrap:wrap;direction:ltr;font-size:1.3rem;margin:14px 0}
.anat button{border:1px solid var(--line);background:var(--bg2);border-radius:6px;padding:6px 14px;cursor:pointer;color:var(--ink);font-family:"JetBrains Mono",monospace}
.anat button.on{border-color:var(--acc);color:var(--acc);box-shadow:var(--glow)}
.steps{list-style:none;padding:0;display:grid;gap:10px;counter-reset:s}
.steps li{counter-increment:s;animation:li .5s both;animation-delay:calc(var(--n)*.15s)}
.steps a{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);background:var(--bg2);border-radius:6px;padding:12px 14px;color:var(--ink);text-decoration:none;transition:border-color .2s,transform .2s}
.steps a:hover{border-color:var(--acc);transform:translateY(-2px)}

const S={en:{adv:"Advanced",why:"Why it works",sech:"Reference library",secp:"Official documentation behind these lessons. Lessons are written from general knowledge and link here; check details against the source for your version.",h1:"Learn Linux by using it.",sub:"The most complete way to learn Linux: from your first command to kernel internals, across every major distribution.",nl:"Lessons",dsp:"Search distributions…",mh:"Missions",mdn:"All missions complete. You just used the same commands real administrators use every day.",close:"Close",nd:"Distributions",brand:"KERNEX",sl1:"UNDERSTAND.",sl2:"ENGINEER.",sl3:"EVOLVE.",ready:"Sandbox ready.",ttl:"KERNEX | Understand. Engineer. Evolve.",ng:"Glossary",gh:"Words you will meet",gp:"Plain definitions for the terms used across the lessons.",wh:"What is Linux, and why does it matter?",w1:"Linux began in 1991 as a hobby kernel written by Linus Torvalds. Today the same kernel runs inside Android phones, most web servers, cloud platforms, routers, cars and the world's fastest supercomputers.",w2:"Linux itself is only the kernel: the part that talks to hardware. Around it people add the GNU tools, a package manager and a desktop, and that complete bundle is called a distribution (Ubuntu, Fedora, Arch…). This is why Linux can look very different from one computer to the next while staying the same underneath.",w3:"You will use it through a terminal: a text window where you type short commands. It feels strange for ten minutes and powerful forever after, because commands can be combined, repeated and automated.",wq:"Learn the ideas once; they work on every distribution.",ns:"Start",go:"Start here",sh:"Start here: how this site works",sp2:"New to Linux? Follow these three steps in order. You do not need to know anything yet.",s1t:"Understand the idea",s1d:"A short animation shows what really happens when you type a command.",s2t:"Try it safely",s2d:"Type real commands in the sandbox terminal. Nothing can harm your computer.",s3t:"Learn step by step",s3d:"Lessons are numbered in reading order. Each ends with a quiz.",eh:"What happens when you type a command",ep:"Linux is built in layers. Watch one command travel down to the hardware and back. Tap any layer to jump to it.",play:"Replay",pause:"Pause",ah:"Anatomy of a command",ap:"Every command has the same shape. Tap each part.",th:"Your sandbox terminal",tp:"This is a practice terminal. Real Linux work happens by typing commands, so here you can try them safely: no install, and nothing can break. Complete the missions below.",lp:"Read in order: the numbers show the sequence. A check mark means completed; the star saves a lesson for later.",next:"Next lesson",plain:"In plain words:",dh:"The distribution universe",dp:"Linux is a kernel; distributions turn it into a system. Each family below has its own packages, release rhythm and philosophy. Tap a distribution to open it.",pm:"Packages",rl:"Releases",ini:"Init",roll:"Rolling",fixed:"Fixed releases",lts:"LTS releases",ent:"Enterprise lifecycle",semi:"About every 6 months",fr:"Fixed and rolling",na:"Not applicable",tbar:"Sandbox terminal — nothing here touches your computer",tnote:"Try: help, ls, cd docs, cat notes.txt, mkdir lab, whoami",ph:"Learning paths",pp:"Each stage ends with something you can demonstrate.",lh:"Lessons",sph:"Search lessons…",all:"All",beg:"Beginner",mid:"Intermediate",sav:"Saved",done:"completed",none:"No lessons match. Clear the search or pick another level.",pre:"Prerequisites",cmd:"Try it",out:"Expected output",risk:"Risks",quiz:"Check yourself",src:"Source",right:"Correct — lesson marked complete.",wrong:"Not quite. Re-read the lesson and try again.",foot:"Developer: tiyam.programmer@gmail.com",nf:"command not found (sandbox)",h:"Commands: help ls cd pwd cat echo mkdir touch whoami uname clear"},
fa:{adv:"پیشرفته",why:"چرا کار می‌کند",sech:"کتابخانهٔ مراجع",secp:"مستندات رسمی پشت این درس‌ها. درس‌ها از دانش عمومی نوشته شده و به این منابع پیوند می‌خورند؛ جزئیات را با منبع نسخهٔ خودتان تطبیق دهید.",h1:"لینوکس را با استفاده از آن یاد بگیرید.",sub:"کامل‌ترین راه یادگیری لینوکس: از اولین دستور تا درون هسته، در میان همهٔ توزیع‌های مهم.",nl:"درس‌ها",dsp:"جست‌وجوی توزیع‌ها…",mh:"ماموریت‌ها",mdn:"همهٔ ماموریت‌ها کامل شد. شما همین حالا همان دستورهایی را به کار بردید که مدیران واقعی هر روز استفاده می‌کنند.",close:"بستن",nd:"توزیع‌ها",brand:"KERNEX",sl1:"درک کن.",sl2:"مهندسی کن.",sl3:"تکامل بیاب.",ready:"ترمینال آزمایشی آماده است.",ttl:"KERNEX | درک کن. مهندسی کن. تکامل بیاب.",ng:"واژه‌نامه",gh:"واژه‌هایی که می‌بینید",gp:"تعریف ساده برای اصطلاح‌هایی که در درس‌ها می‌آید.",wh:"لینوکس چیست و چرا مهم است؟",w1:"لینوکس در سال ۱۹۹۱ به‌صورت یک هستهٔ سرگرمی توسط لینوس توروالدز شروع شد. امروز همان هسته در گوشی‌های اندرویدی، بیشتر وب‌سرورها، پلتفرم‌های ابری، مسیریاب‌ها، خودروها و سریع‌ترین ابررایانه‌های جهان اجرا می‌شود.",w2:"خود لینوکس فقط هسته است: بخشی که با سخت‌افزار حرف می‌زند. دورش ابزارهای GNU، مدیر بسته و دسکتاپ اضافه می‌شود و این بستهٔ کامل «توزیع» نام دارد (اوبونتو، فدورا، آرچ و…). برای همین لینوکس روی هر رایانه می‌تواند متفاوت به نظر برسد ولی زیرش یکی است.",w3:"شما با ترمینال از آن استفاده می‌کنید: پنجره‌ای متنی که در آن دستورهای کوتاه می‌نویسید. ده دقیقه عجیب است و بعد از آن همیشه قدرتمند، چون دستورها را می‌شود ترکیب، تکرار و خودکار کرد.",wq:"ایده‌ها را یک بار یاد بگیرید؛ روی هر توزیعی کار می‌کنند.",ns:"شروع",go:"از اینجا شروع کنید",sh:"از اینجا شروع کنید: سایت چطور کار می‌کند",sp2:"با لینوکس آشنا نیستید؟ این سه مرحله را به ترتیب دنبال کنید. لازم نیست چیزی بلد باشید.",s1t:"ایده را بفهمید",s1d:"یک انیمیشن کوتاه نشان می‌دهد وقتی دستوری می‌نویسید واقعاً چه اتفاقی می‌افتد.",s2t:"امن امتحان کنید",s2d:"در ترمینال آزمایشی دستور واقعی بنویسید. هیچ چیز به رایانهٔ شما آسیب نمی‌زند.",s3t:"قدم‌به‌قدم یاد بگیرید",s3d:"درس‌ها به ترتیب مطالعه شماره‌گذاری شده‌اند و هر کدام با آزمون تمام می‌شود.",eh:"وقتی دستوری می‌نویسید چه اتفاقی می‌افتد",ep:"لینوکس لایه‌لایه ساخته شده. ببینید یک دستور چگونه تا سخت‌افزار پایین می‌رود و برمی‌گردد. روی هر لایه بزنید تا به آن برسید.",play:"پخش دوباره",pause:"توقف",ah:"کالبدشکافی یک دستور",ap:"هر دستور همین شکل را دارد. روی هر بخش بزنید.",th:"ترمینال آزمایشی شما",tp:"این یک ترمینال تمرینی است. کار واقعی در لینوکس با نوشتن دستور انجام می‌شود؛ اینجا می‌توانید بدون نصب و بدون ترس از خراب‌کردن چیزی امتحانش کنید. ماموریت‌های زیر را کامل کنید.",lp:"به ترتیب بخوانید: شماره‌ها توالی را نشان می‌دهند. علامت تیک یعنی تکمیل شده و ستاره درس را برای بعد ذخیره می‌کند.",next:"درس بعدی",plain:"به زبان ساده:",dh:"جهان توزیع‌ها",dp:"لینوکس یک هسته است و توزیع‌ها آن را به یک سیستم کامل تبدیل می‌کنند. هر خانواده بسته‌ها، ریتم انتشار و فلسفهٔ خودش را دارد. روی یک توزیع بزنید تا باز شود.",pm:"بسته‌ها",rl:"انتشار",ini:"راه‌انداز",roll:"رولینگ",fixed:"انتشار ثابت",lts:"انتشار LTS",ent:"چرخهٔ سازمانی",semi:"تقریباً هر ۶ ماه",fr:"ثابت و رولینگ",na:"نامربوط",tbar:"ترمینال آزمایشی — هیچ چیز روی رایانهٔ شما اجرا نمی‌شود",tnote:"امتحان کنید: help، ls، cd docs، cat notes.txt، mkdir lab، whoami",ph:"مسیرهای یادگیری",pp:"هر مرحله با چیزی پایان می‌یابد که می‌توانید نشان دهید.",lh:"درس‌ها",sph:"جستجوی درس…",all:"همه",beg:"مبتدی",mid:"متوسط",sav:"ذخیره‌شده",done:"تکمیل شده",none:"درسی پیدا نشد. جستجو را پاک کنید یا سطح دیگری انتخاب کنید.",pre:"پیش‌نیازها",cmd:"امتحان کنید",out:"خروجی مورد انتظار",risk:"خطرها",quiz:"خودتان را بسنجید",src:"منبع",right:"درست است — درس تکمیل شد.",wrong:"درست نیست. درس را دوباره بخوانید و دوباره تلاش کنید.",foot:"Developer: tiyam.programmer@gmail.com",nf:"دستور یافت نشد (محیط آزمایشی)",h:"دستورها: help ls cd pwd cat echo mkdir touch whoami uname clear"}};

{id:"what",lv:"beginner",t:["Kernel vs distribution","هسته در برابر توزیع"],b:["Linux is a kernel: it manages CPU, memory, devices and processes. A distribution (Debian, Fedora, Arch…) bundles the kernel with GNU tools, an init system, a package manager and defaults. That is why 'Linux' commands mostly come from GNU coreutils and behave the same across distributions, while installers and package tools differ.","لینوکس یک هسته است: پردازنده، حافظه، دستگاه‌ها و فرایندها را مدیریت می‌کند. توزیع (دبیان، فدورا، آرچ و…) هسته را با ابزارهای GNU، سیستم init، مدیر بسته و تنظیمات پیش‌فرض بسته‌بندی می‌کند. به همین دلیل بیشتر دستورها از GNU coreutils می‌آیند و در توزیع‌ها یکسان‌اند، اما نصب‌کننده و ابزار بسته فرق دارد."],pre:["None","هیچ"],c:"uname -sr",o:"Linux 6.x.x-generic",r:["Version output varies by machine.","خروجی نسخه بسته به دستگاه فرق می‌کند."],q:["What does the kernel do?",["Manages hardware and processes","Provides the package manager","Draws the desktop"],0,["کار هسته چیست؟",["مدیریت سخت‌افزار و فرایندها","ارائهٔ مدیر بسته","رسم دسکتاپ"]]],s:"https://www.kernel.org/"},
{id:"fhs",lv:"beginner",t:["The filesystem hierarchy","ساختار سلسله‌مراتب فایل"],b:["Everything hangs from one root, /. By the Filesystem Hierarchy Standard, /etc holds configuration, /home user files, /var changing data such as logs, /usr installed programs, /tmp temporary files. Devices and processes also appear as files under /dev and /proc.","همه‌چیز از یک ریشه، /، آویزان است. طبق استاندارد FHS، /etc تنظیمات، /home فایل‌های کاربران، /var داده‌های متغیر مثل لاگ‌ها، /usr برنامه‌های نصب‌شده و /tmp فایل‌های موقت را نگه می‌دارد. دستگاه‌ها و فرایندها هم زیر /dev و /proc به شکل فایل دیده می‌شوند."],pre:["Kernel vs distribution","هسته در برابر توزیع"],c:"ls /",o:"bin  boot  dev  etc  home  lib  proc  tmp  usr  var …",r:["Distributions differ slightly; some merge /bin into /usr/bin.","توزیع‌ها اندکی فرق دارند؛ برخی /bin را در /usr/bin ادغام کرده‌اند."],q:["Where is system configuration stored?",["/tmp","/etc","/proc"],1,["تنظیمات سیستم کجا ذخیره می‌شود؟",["/tmp","/etc","/proc"]]],s:"https://refspecs.linuxfoundation.org/fhs.shtml"},
{id:"nav",lv:"beginner",t:["Moving around: pwd, cd, ls","حرکت در سیستم: pwd، cd، ls"],b:["pwd prints where you are. cd changes directory; cd .. goes up and cd alone returns home. ls lists contents; -l adds details, -a shows hidden files whose names start with a dot.","pwd مکان فعلی را چاپ می‌کند. cd پوشه را عوض می‌کند؛ cd .. یک سطح بالا می‌رود و cd به تنهایی به خانه برمی‌گرداند. ls محتوا را فهرست می‌کند؛ -l جزئیات و -a فایل‌های پنهان (نام‌های شروع‌شونده با نقطه) را نشان می‌دهد."],pre:["The filesystem hierarchy","ساختار سلسله‌مراتب فایل"],c:"cd /var/log && ls -la",o:"drwxr-xr-x … .  syslog  auth.log …",r:["None; these commands only read.","ندارد؛ این دستورها فقط می‌خوانند."],q:["Which flag shows hidden files?",["-l","-a","-h"],1,["کدام گزینه فایل‌های پنهان را نشان می‌دهد؟",["-l","-a","-h"]]],s:"https://www.gnu.org/software/coreutils/manual/"},
{id:"perm",lv:"beginner",t:["Permissions and chmod","مجوزها و chmod"],b:["ls -l shows ten characters such as -rwxr-xr--: file type, then read/write/execute for owner, group, others. chmod 640 file sets owner rw-, group r--, others none (r=4, w=2, x=1). Directories need x to be entered.","ls -l ده نویسه مانند -rwxr-xr-- نشان می‌دهد: نوع فایل و سپس خواندن/نوشتن/اجرا برای مالک، گروه و دیگران. chmod 640 file به مالک rw-، به گروه r-- و به دیگران هیچ می‌دهد (r=4، w=2، x=1). برای ورود به پوشه، مجوز x لازم است."],pre:["Moving around","حرکت در سیستم"],c:"chmod 640 notes.txt && ls -l notes.txt",o:"-rw-r----- 1 you you 12 … notes.txt",r:["chmod -R 777 makes everything writable by everyone and is a common security mistake.","chmod -R 777 همه‌چیز را برای همه قابل‌نوشتن می‌کند و اشتباه امنیتی رایجی است."],q:["What does 640 give 'others'?",["Read","Nothing","Write"],1,["عدد 640 به «دیگران» چه می‌دهد؟",["خواندن","هیچ","نوشتن"]]],s:"https://man7.org/linux/man-pages/man1/chmod.1.html"},
{id:"pipe",lv:"intermediate",t:["Pipes and redirection","لوله‌ها و تغییر مسیر"],b:["A pipe | sends one command's output into the next command's input. > writes output to a file (replacing it), >> appends, 2> redirects errors. Small tools chained together replace large programs.","لوله | خروجی یک دستور را به ورودی دستور بعدی می‌دهد. > خروجی را در فایل می‌نویسد (و جایگزین می‌کند)، >> اضافه می‌کند و 2> خطاها را تغییر مسیر می‌دهد. ابزارهای کوچک زنجیره‌شده جای برنامه‌های بزرگ را می‌گیرند."],pre:["Permissions","مجوزها"],c:"ls /etc | grep conf | wc -l",o:"a number, e.g. 42",r:["> silently overwrites an existing file; use >> or set -o noclobber.","> بدون هشدار فایل موجود را بازنویسی می‌کند؛ از >> یا set -o noclobber استفاده کنید."],q:["Which operator appends to a file?",[">",">>","|"],1,["کدام عملگر به فایل اضافه می‌کند؟",[">",">>","|"]]],s:"https://www.gnu.org/software/bash/manual/"},
{id:"proc",lv:"intermediate",t:["Processes and signals","فرایندها و سیگنال‌ها"],b:["Every running program is a process with a PID. ps aux lists them; top shows live usage. kill PID sends SIGTERM, a polite request to stop; kill -9 sends SIGKILL, which cannot be caught and skips cleanup.","هر برنامهٔ در حال اجرا یک فرایند با شناسهٔ PID است. ps aux آن‌ها را فهرست می‌کند و top مصرف زنده را نشان می‌دهد. kill PID سیگنال SIGTERM (درخواست مؤدبانهٔ توقف) و kill -9 سیگنال SIGKILL را می‌فرستد که قابل‌گرفتن نیست و پاکسازی را رد می‌کند."],pre:["Pipes and redirection","لوله‌ها و تغییر مسیر"],c:"ps aux | head -3",o:"USER PID %CPU %MEM … COMMAND",r:["Killing the wrong PID can stop a service or lose unsaved data; try SIGTERM first.","کشتن PID اشتباه می‌تواند سرویس را متوقف یا داده را از بین ببرد؛ ابتدا SIGTERM را امتحان کنید."],q:["Which signal can a program not ignore?",["SIGTERM","SIGKILL","SIGHUP"],1,["برنامه کدام سیگنال را نمی‌تواند نادیده بگیرد؟",["SIGTERM","SIGKILL","SIGHUP"]]],s:"https://man7.org/linux/man-pages/man7/signal.7.html"},
{id:"pkg",lv:"intermediate",t:["Package managers","مدیران بسته"],b:["Packages are installed from signed repositories. Debian/Ubuntu: apt. Fedora/RHEL: dnf. Arch: pacman. The idea is identical, the syntax differs. Always refresh metadata first and read what will change before confirming. Distribution-specific: these commands do not work across families.","بسته‌ها از مخازن امضاشده نصب می‌شوند. دبیان/اوبونتو: apt. فدورا/RHEL: dnf. آرچ: pacman. ایده یکی است و نحو فرق دارد. همیشه ابتدا فراداده را به‌روز کنید و پیش از تأیید، تغییرات را بخوانید. وابسته به توزیع: این دستورها بین خانواده‌ها کار نمی‌کنند."],pre:["Permissions","مجوزها"],c:"sudo apt update && apt list --upgradable",o:"Hit:1 … packages can be upgraded",r:["Adding third-party repositories gives them root-level trust over your system.","افزودن مخزن شخص ثالث به آن‌ها اعتماد در سطح root می‌دهد."],q:["Which tool is Fedora's default?",["apt","dnf","pacman"],1,["ابزار پیش‌فرض فدورا کدام است؟",["apt","dnf","pacman"]]],s:"https://documentation.ubuntu.com/"},
{id:"sysd",lv:"intermediate",t:["Services with systemd","سرویس‌ها با systemd"],b:["On most modern distributions systemd starts and supervises services. systemctl status ssh shows state; start/stop act now; enable makes a service start at boot. journalctl -u ssh reads its logs.","در بیشتر توزیع‌های امروزی، systemd سرویس‌ها را راه‌اندازی و نظارت می‌کند. systemctl status ssh وضعیت را نشان می‌دهد؛ start/stop همین حالا عمل می‌کنند و enable سرویس را برای اجرا در بوت فعال می‌کند. journalctl -u ssh لاگ‌های آن را می‌خواند."],pre:["Processes and signals","فرایندها و سیگنال‌ها"],c:"systemctl status ssh",o:"● ssh.service - OpenBSD Secure Shell server  Active: active (running)",r:["Stopping ssh over an SSH session locks you out. The unit name varies (sshd on some distributions).","متوقف‌کردن ssh در یک نشست SSH شما را بیرون می‌اندازد. نام یونیت فرق می‌کند (در برخی توزیع‌ها sshd)."],q:["Which command starts a service at boot?",["start","enable","status"],1,["کدام دستور سرویس را در بوت فعال می‌کند؟",["start","enable","status"]]],s:"https://systemd.io/"},
{id:"user",lv:"beginner",t:["Users, groups and sudo","کاربران، گروه‌ها و sudo"],b:["Every process runs as a user with a numeric UID; access is decided by that UID and the groups (GIDs) it belongs to. id shows both. sudo runs one command with administrator rights, as allowed by the sudoers policy, so you avoid working as root all day.","هر فرایند با یک کاربر و شناسهٔ عددی UID اجرا می‌شود؛ دسترسی بر اساس همین شناسه و گروه‌های (GID) آن تعیین می‌شود. id هر دو را نشان می‌دهد. sudo یک دستور را طبق سیاست sudoers با دسترسی مدیر اجرا می‌کند تا مجبور نباشید همیشه root باشید."],pre:["Permissions","مجوزها"],c:"id",o:"uid=1000(you) gid=1000(you) groups=1000(you),27(sudo)",r:["Edit /etc/sudoers only with visudo; a syntax error can lock you out of sudo.","فایل /etc/sudoers را فقط با visudo ویرایش کنید؛ یک خطای نحوی می‌تواند sudo را از کار بیندازد."],q:["Which command shows your UID and groups?",["id","pwd","ps"],0,["کدام دستور UID و گروه‌های شما را نشان می‌دهد؟",["id","pwd","ps"]]],s:"https://man7.org/linux/man-pages/man1/id.1.html"},
{id:"text",lv:"intermediate",t:["Text tools: sort, uniq, cut, wc","ابزارهای متن: sort، uniq، cut، wc"],b:["These GNU coreutils each do one job on lines of text. sort orders lines, uniq -c counts adjacent duplicates (so sort first), cut -d: -f1 picks a field, wc -l counts lines. Chained with pipes they answer questions about logs and data in seconds.","هر یک از این ابزارهای GNU coreutils یک کار روی خطوط متن انجام می‌دهد. sort خطوط را مرتب می‌کند، uniq -c تکرارهای مجاور را می‌شمارد (پس اول sort کنید)، cut -d: -f1 یک ستون را برمی‌دارد و wc -l خطوط را می‌شمارد. با لوله، پاسخ پرسش‌های مربوط به لاگ و داده در چند ثانیه به دست می‌آید."],pre:["Pipes and redirection","لوله‌ها و تغییر مسیر"],c:"cut -d: -f7 /etc/passwd | sort | uniq -c | sort -nr",o:"  18 /usr/sbin/nologin\n   2 /bin/bash",r:["Output ordering and shells listed vary by system.","ترتیب و پوسته‌های فهرست‌شده در هر سیستم فرق می‌کند."],q:["Why run sort before uniq -c?",["uniq only merges adjacent duplicates","sort deletes lines","uniq needs root"],0,["چرا پیش از uniq -c باید sort کرد؟",["uniq فقط تکرارهای مجاور را ادغام می‌کند","sort خطوط را حذف می‌کند","uniq به root نیاز دارد"]]],s:"https://www.gnu.org/software/coreutils/manual/"},
{id:"bash",lv:"intermediate",t:["Bash scripting basics","مبانی اسکریپت‌نویسی Bash"],b:["A script is a text file starting with a shebang (#!/usr/bin/env bash) and made executable with chmod +x. Assign variables without spaces (name=Ada), read them with $name, and always quote expansions (\"$name\") so spaces in values do not split into several words. Every command returns an exit status; 0 means success, available as $?.","اسکریپت یک فایل متنی است که با shebang (‎#!/usr/bin/env bash) شروع می‌شود و با chmod +x اجرایی می‌شود. متغیر را بدون فاصله مقداردهی کنید (name=Ada)، با $name بخوانید و همیشه آن را داخل نقل‌قول بگذارید (\"$name\") تا فاصله‌های درون مقدار به چند کلمه شکسته نشود. هر دستور یک وضعیت خروج برمی‌گرداند؛ ۰ یعنی موفق و در $? در دسترس است."],pre:["Permissions","مجوزها"],c:"name=\"Ada\"; echo \"Hello, $name\"; echo $?",o:"Hello, Ada\n0",r:["Unquoted variables in commands like rm $dir/* can delete the wrong files when the value is empty or has spaces.","متغیر بدون نقل‌قول در دستوری مانند rm $dir/* هنگامی که مقدار خالی است یا فاصله دارد می‌تواند فایل‌های نادرست را پاک کند."],q:["What does exit status 0 mean?",["Success","Failure","Command not found"],0,["وضعیت خروج ۰ یعنی چه؟",["موفقیت","شکست","دستور یافت نشد"]]],s:"https://www.gnu.org/software/bash/manual/"},
{id:"boot",lv:"intermediate",t:["The boot process","فرایند بوت"],b:["Firmware (UEFI or BIOS) finds a bootloader such as GRUB, which loads the kernel and an initramfs, a small early filesystem. The kernel mounts the real root filesystem and starts PID 1, usually systemd, which brings up services until the target is reached. Knowing the order tells you where to look when a machine will not start.","میان‌افزار (UEFI یا BIOS) یک بوت‌لودر مانند GRUB را پیدا می‌کند که هسته و initramfs (فایل‌سیستم کوچک اولیه) را بارگذاری می‌کند. هسته فایل‌سیستم اصلی را سوار می‌کند و PID 1 (معمولاً systemd) را اجرا می‌کند که سرویس‌ها را تا رسیدن به هدف بالا می‌آورد. دانستن این ترتیب نشان می‌دهد وقتی دستگاه بالا نمی‌آید کجا باید دنبال خطا گشت."],pre:["Services with systemd","سرویس‌ها با systemd"],c:"systemd-analyze",o:"Startup finished in 3.1s (kernel) + 9.4s (userspace) = 12.5s",r:["A wrong bootloader or fstab edit can leave a system unbootable; keep a live USB and a backup first.","ویرایش اشتباه بوت‌لودر یا fstab می‌تواند سیستم را بالا نیاورد؛ ابتدا یک USB زنده و پشتیبان داشته باشید."],q:["What is PID 1 on most modern distributions?",["systemd","bash","GRUB"],0,["PID 1 در بیشتر توزیع‌های امروزی چیست؟",["systemd","bash","GRUB"]]],s:"https://wiki.archlinux.org/title/Arch_boot_process"},
{id:"net",lv:"intermediate",t:["Networking basics: ip and ss","مبانی شبکه: ip و ss"],b:["ip addr shows interfaces and addresses, ip route shows where traffic goes, and ss -tuln lists listening TCP/UDP sockets. Read them in that order when a connection fails: do I have an address, a route, and is the service really listening?","ip addr رابط‌ها و آدرس‌ها را نشان می‌دهد، ip route مسیر ترافیک را و ss -tuln سوکت‌های در حال گوش‌دادن TCP/UDP را. وقتی اتصال برقرار نمی‌شود به همین ترتیب بخوانید: آدرس دارم؟ مسیر دارم؟ و آیا سرویس واقعاً گوش می‌دهد؟"],pre:["Processes and signals","فرایندها و سیگنال‌ها"],c:"ip -brief addr",o:"lo   UNKNOWN 127.0.0.1/8\neth0 UP      192.168.1.20/24",r:["Changing addresses or routes over an SSH session can cut you off from the machine.","تغییر آدرس یا مسیر در نشست SSH می‌تواند ارتباط شما با دستگاه را قطع کند."],q:["Which command lists listening sockets?",["ss -tuln","ip route","id"],0,["کدام دستور سوکت‌های در حال گوش‌دادن را فهرست می‌کند؟",["ss -tuln","ip route","id"]]],s:"https://man7.org/linux/man-pages/man8/ip.8.html"},
{id:"disk",lv:"intermediate",t:["Disks, filesystems and mounting","دیسک‌ها، فایل‌سیستم‌ها و مونت"],b:["Block devices appear as /dev/sda or /dev/nvme0n1, split into partitions, each formatted with a filesystem such as ext4 or Btrfs and mounted at a directory. lsblk -f shows the layout; df -h shows free space; /etc/fstab lists what mounts at boot.","دستگاه‌های بلوکی به شکل /dev/sda یا /dev/nvme0n1 دیده می‌شوند، به پارتیشن‌ها تقسیم می‌شوند، هر کدام با فایل‌سیستمی مانند ext4 یا Btrfs فرمت می‌شود و در یک پوشه سوار (mount) می‌شود. lsblk -f چیدمان را نشان می‌دهد، df -h فضای آزاد را و /etc/fstab آنچه را در بوت مونت می‌شود."],pre:["The filesystem hierarchy","ساختار سلسله‌مراتب فایل"],c:"lsblk -f",o:"NAME FSTYPE MOUNTPOINTS\nnvme0n1p1 vfat /boot/efi\nnvme0n1p2 ext4 /",r:["mkfs and dd destroy data on the target device; triple-check the device name first.","mkfs و dd داده‌های دستگاه هدف را نابود می‌کنند؛ نام دستگاه را چند بار بررسی کنید."],q:["Which file lists mounts applied at boot?",["/etc/fstab","/proc","/tmp"],0,["کدام فایل مونت‌های زمان بوت را فهرست می‌کند؟",["/etc/fstab","/proc","/tmp"]]],s:"https://docs.kernel.org/filesystems/index.html"},
{id:"kernel",lv:"advanced",t:["Kernel space, user space and system calls","فضای هسته، فضای کاربر و فراخوانی‌های سیستمی"],b:["The kernel runs in privileged kernel space; your programs run in user space and ask the kernel for services through system calls such as open, read, write and fork. Libraries like glibc wrap these calls so programs rarely invoke them directly. Drivers are often loadable modules, added with modprobe and listed with lsmod, and /proc and /sys expose kernel state as ordinary files you can read.","هسته در فضای هسته با دسترسی ویژه اجرا می‌شود؛ برنامه‌های شما در فضای کاربر اجرا می‌شوند و از طریق فراخوانی‌های سیستمی مانند open، read، write و fork از هسته خدمات می‌خواهند. کتابخانه‌هایی مثل glibc این فراخوانی‌ها را بسته‌بندی می‌کنند تا برنامه‌ها کمتر مستقیم آن‌ها را صدا بزنند. درایورها اغلب ماژول‌های بارگذاری‌شدنی‌اند که با modprobe اضافه و با lsmod فهرست می‌شوند و /proc و /sys وضعیت هسته را به شکل فایل‌های عادی در اختیار می‌گذارند."],w:["This split is why a buggy program crashes only itself, while a buggy driver can bring down the whole machine, and why permission checks happen at the system-call boundary.","به همین دلیل یک برنامهٔ معیوب فقط خودش از کار می‌افتد ولی یک درایور معیوب می‌تواند کل دستگاه را از کار بیندازد، و بررسی مجوزها در مرز فراخوانی سیستمی انجام می‌شود."],pre:["The boot process","فرایند بوت"],c:"lsmod | head -3",o:"Module                  Size  Used by\nsnd_hda_intel          61440  3\nbtusb                  73728  0",r:["Loading modules needs root; a faulty or untrusted module can crash or compromise the system.","بارگذاری ماژول به root نیاز دارد؛ ماژول معیوب یا غیرقابل‌اعتماد می‌تواند سیستم را از کار بیندازد یا به خطر بیندازد."],q:["How does a user program request kernel services?",["System calls","Environment variables","The shell prompt"],0,["برنامهٔ کاربر چگونه از هسته خدمات می‌خواهد؟",["فراخوانی سیستمی","متغیرهای محیطی","اعلان پوسته"]]],s:"https://docs.kernel.org/"},
{id:"lfs",lv:"advanced",t:["Linux From Scratch: the build plan","Linux From Scratch: نقشهٔ ساخت"],b:["Linux From Scratch (LFS) is a book, not a distribution: it guides you through building a complete system from source tarballs. You set $LFS to the target partition's mount point, build a cross-toolchain (Binutils pass 1, GCC pass 1, Linux API headers, Glibc), use it to build temporary tools, prepare the virtual kernel filesystems and enter a chroot, rebuild everything natively, then compile the kernel and configure booting. Beyond Linux From Scratch (BLFS) continues with desktops, servers and more.","Linux From Scratch (LFS) یک کتاب است نه یک توزیع: شما را گام‌به‌گام در ساخت یک سیستم کامل از روی کد منبع راهنمایی می‌کند. ابتدا $LFS را روی نقطهٔ مونت پارتیشن مقصد تنظیم می‌کنید، یک زنجیرهٔ ابزار متقابل (Binutils مرحلهٔ ۱، GCC مرحلهٔ ۱، هدرهای Linux API و Glibc) می‌سازید، با آن ابزارهای موقت را می‌سازید، فایل‌سیستم‌های مجازی هسته را آماده می‌کنید و وارد chroot می‌شوید، همه‌چیز را دوباره به‌صورت بومی می‌سازید و در پایان هسته را کامپایل و راه‌اندازی را تنظیم می‌کنید. کتاب Beyond LFS (BLFS) ادامه می‌دهد: دسکتاپ، سرورها و بیشتر."],w:["The cross-toolchain comes first so the final system does not depend on the host's libraries; the chroot then isolates the build from the host. Package order matters because later packages need earlier ones.","زنجیرهٔ ابزار متقابل اول ساخته می‌شود تا سیستم نهایی به کتابخانه‌های میزبان وابسته نباشد؛ سپس chroot ساخت را از میزبان جدا می‌کند. ترتیب بسته‌ها مهم است چون بسته‌های بعدی به قبلی‌ها نیاز دارند."],pre:["Kernel space, user space and system calls","فضای هسته، فضای کاربر و فراخوانی‌های سیستمی"],c:"export LFS=/mnt/lfs && echo $LFS",o:"/mnt/lfs",r:["If $LFS is empty, a path like $LFS/tools can resolve to the host's /tools and commands may touch the running system. Check echo $LFS before every session and work as an unprivileged user where the book says so.","اگر $LFS خالی باشد، مسیری مانند $LFS/tools می‌تواند به /tools میزبان تبدیل شود و دستورها به سیستم در حال اجرا آسیب بزنند. قبل از هر نشست echo $LFS را بررسی کنید و هر جا کتاب می‌گوید با کاربر بدون دسترسی کار کنید."],q:["Why is a cross-toolchain built first?",["So the final system does not depend on the host's libraries","To speed up the kernel","To avoid using a chroot"],0,["چرا زنجیرهٔ ابزار متقابل اول ساخته می‌شود؟",["تا سیستم نهایی به کتابخانه‌های میزبان وابسته نباشد","برای سریع‌شدن هسته","برای اینکه به chroot نیازی نباشد"]]],s:"https://www.linuxfromscratch.org/lfs/read.html"},
{id:"deb",lv:"intermediate",t:["Debian packages: dpkg and apt","بسته‌های دبیان: dpkg و apt"],b:["Debian packages (.deb) are handled by dpkg at the low level and APT at the high level, which fetches from repositories and resolves dependencies. dpkg -S finds which package owns a file, dpkg -L lists a package's files, and apt policy shows candidate versions and where they come from.","بسته‌های دبیان (.deb) در سطح پایین با dpkg و در سطح بالا با APT مدیریت می‌شوند که از مخازن دریافت می‌کند و وابستگی‌ها را حل می‌کند. dpkg -S نشان می‌دهد یک فایل متعلق به کدام بسته است، dpkg -L فایل‌های یک بسته را فهرست می‌کند و apt policy نسخه‌های کاندید و منبعشان را نشان می‌دهد."],w:["Knowing who owns a file lets you trace configuration and repair broken installs. The Debian Reference covers these tools in depth.","دانستن مالک یک فایل کمک می‌کند تنظیمات را ردیابی کنید و نصب‌های خراب را تعمیر کنید. Debian Reference این ابزارها را به‌طور مفصل شرح می‌دهد."],pre:["Package managers","مدیران بسته"],c:"dpkg -S /bin/ls",o:"coreutils: /bin/ls",r:["Debian and Ubuntu only. The path may show /usr/bin/ls on merged-/usr systems. Forcing dpkg options bypasses dependency checks and can break the system; prefer apt.","فقط دبیان و اوبونتو. در سیستم‌های merged-/usr مسیر ممکن است /usr/bin/ls باشد. گزینه‌های اجباری dpkg بررسی وابستگی را دور می‌زنند و سیستم را خراب می‌کنند؛ apt را ترجیح دهید."],q:["Which command finds the package that owns a file?",["dpkg -S","dpkg -L","apt update"],0,["کدام دستور بستهٔ مالک یک فایل را پیدا می‌کند؟",["dpkg -S","dpkg -L","apt update"]]],s:"https://www.debian.org/doc/manuals/debian-reference/"}];

const PL={what:["Think of a computer as a restaurant: the kernel is the kitchen manager who decides who gets the stove, and the distribution is the whole restaurant built around it.","کامپیوتر را یک رستوران فرض کنید: هسته مدیر آشپزخانه است که تصمیم می‌گیرد چه کسی از اجاق استفاده کند و توزیع کل رستورانی است که دورش ساخته شده."],fhs:["Like a building with fixed floors: configuration lives on one floor (/etc), people's belongings on another (/home), so you always know where to look.","مثل ساختمانی با طبقه‌های ثابت: تنظیمات در یک طبقه (/etc) و وسایل افراد در طبقه‌ای دیگر (/home) است، پس همیشه می‌دانید کجا بگردید."],nav:["These three commands are your eyes and legs: pwd says where you stand, ls shows what is around you, cd walks to another room.","این سه دستور چشم و پای شما هستند: pwd می‌گوید کجا ایستاده‌اید، ls اطراف را نشان می‌دهد و cd شما را به اتاق دیگر می‌برد."],perm:["Permissions are door locks: each file has separate keys for its owner, a group and everyone else.","مجوزها قفل درند: هر فایل برای مالک، یک گروه و بقیهٔ افراد کلیدهای جدا دارد."],user:["Users are people with ID cards; sudo is a temporary visitor pass to a restricted area.","کاربران آدم‌هایی با کارت شناسایی‌اند؛ sudo کارت موقت ورود به یک منطقهٔ ممنوعه است."],pipe:["A pipe is a conveyor belt: one tool's output rides straight into the next tool.","لوله مثل نوار نقاله است: خروجی یک ابزار مستقیم به ورودی ابزار بعدی می‌رود."],text:["Each tool is a small worker on an assembly line: one sorts, one counts, one cuts out a column.","هر ابزار یک کارگر کوچک خط تولید است: یکی مرتب می‌کند، یکی می‌شمارد و یکی یک ستون را جدا می‌کند."],bash:["A script is a recipe: the same steps, written once, that you can run again and again.","اسکریپت مثل دستور پخت است: همان مراحل یک بار نوشته می‌شود و هر بار می‌توانید اجرایش کنید."],proc:["A process is a running program, like a cook at work; a signal is a note you hand them: please stop, or stop now.","فرایند برنامه‌ای در حال اجراست، مثل آشپزی که مشغول کار است؛ سیگنال یادداشتی است که به او می‌دهید: لطفاً بایست، یا همین حالا بایست."],pkg:["A package manager is an app store for the terminal: it finds, installs and updates software for you.","مدیر بسته مثل فروشگاه برنامه در ترمینال است: نرم‌افزار را پیدا، نصب و به‌روزرسانی می‌کند."],sysd:["systemd is the building manager who starts services in the right order and restarts them if they fall over.","systemd مدیر ساختمان است که سرویس‌ها را به ترتیب درست روشن می‌کند و اگر از کار افتادند دوباره راه می‌اندازد."],boot:["Booting is a relay race: firmware passes the baton to the bootloader, then the kernel, then systemd.","بوت‌شدن مثل دوی امدادی است: میان‌افزار باتوم را به بوت‌لودر می‌دهد، بعد هسته و بعد systemd."],net:["An address is where you live, a route is the road out, a socket is a door someone is listening at.","آدرس یعنی کجا زندگی می‌کنید، مسیر یعنی جادهٔ خروج و سوکت دری است که کسی پشتش گوش می‌دهد."],disk:["A disk is land, a partition is a plot, a filesystem is the street plan, and mounting connects the plot to your city map.","دیسک زمین است، پارتیشن یک قطعه، فایل‌سیستم نقشهٔ خیابان‌ها و mount آن قطعه را به نقشهٔ شهر شما وصل می‌کند."],kernel:["Programs live in the lobby and must ask the front desk (the kernel) for anything that touches the machinery.","برنامه‌ها در لابی زندگی می‌کنند و برای هر کاری که به ماشین‌آلات مربوط است باید از میز پذیرش (هسته) بخواهند."],lfs:["Instead of buying a built house, you pour the foundation, cut the timber and assemble every room yourself.","به‌جای خرید خانهٔ ساخته‌شده، خودتان پی را می‌ریزید، چوب را می‌برید و تک‌تک اتاق‌ها را سرهم می‌کنید."]};L.forEach(l=>l.p=PL[l.id]);
const F={core:[["The kernel","هسته"],["The one thing every distribution shares. Tap it to see how a kernel differs from a distribution.","تنها چیزی که همهٔ توزیع‌ها مشترک دارند. روی آن بزنید تا تفاوت هسته و توزیع را ببینید."]],bsd:[["Unix relatives (not Linux)","خویشاوندان یونیکس (نه لینوکس)"],["These look familiar in the terminal but use a different kernel. They are worth knowing because many Linux ideas come from the Unix world.","این‌ها در ترمینال آشنا به نظر می‌رسند اما هستهٔ دیگری دارند. شناختنشان ارزش دارد چون بسیاری از ایده‌های لینوکس از دنیای یونیکس آمده‌اند."]],deb:[["Debian family","خانوادهٔ دبیان"],["Built on .deb packages and APT. Debian is the stable foundation; Ubuntu, Mint and Kali build on it, so what you learn transfers across all of them.","بر پایهٔ بسته‌های deb. و APT. دبیان پایهٔ پایدار است؛ اوبونتو، مینت و کالی روی آن ساخته شده‌اند، پس آموخته‌های شما بین همه‌شان منتقل می‌شود."]],rh:[["Red Hat family","خانوادهٔ Red Hat"],["RPM packages with dnf. Fedora is the fast upstream, RHEL the commercial enterprise product, and Rocky or AlmaLinux are free compatible rebuilds of RHEL.","بسته‌های RPM با dnf. فدورا شاخهٔ پرشتاب بالادستی است، RHEL محصول تجاری سازمانی، و Rocky و AlmaLinux بازسازی‌های رایگان سازگار با RHEL‌اند."]],suse:[["SUSE family","خانوادهٔ SUSE"],["RPM with zypper, traditionally known for strong administration tools and Btrfs snapshots. openSUSE is community-driven; SLES is the enterprise edition.","RPM با zypper؛ از قدیم به ابزارهای مدیریتی قوی و اسنپ‌شات‌های Btrfs شناخته می‌شود. openSUSE جامعه‌محور است و SLES نسخهٔ سازمانی."]],arch:[["Arch family","خانوادهٔ آرچ"],["Rolling releases, the pacman package manager and a hands-on philosophy. The Arch Wiki is used as a reference even by people on other distributions.","انتشار رولینگ، مدیر بستهٔ pacman و فلسفهٔ دست‌به‌کار. ویکی آرچ حتی برای کاربران توزیع‌های دیگر هم مرجع است."]],src:[["Control and tradition","کنترل و سنت"],["Gentoo compiles software to your configuration; Slackware stays close to
